name: Daily Data Sync and Deploy

on:
  schedule:
    - cron: '0 0 * * *' # Every day at 00:00 UTC
  push:
    paths:
      - 'data/*.json'
      - 'registry/downloads_registry.json'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portal repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Sync data from retrieve_edital
        run: node scripts/sync-data.js

      - name: Validate data schema
        run: node scripts/validate-data.js

      - name: Run script tests
        run: npm run test:scripts

      - name: Build site with Astro
        run: npm run build

      - name: Index searches with Pagefind
        run: npx pagefind --site dist

      - name: Commit and push synced data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes in data to commit"
          else
            git commit -m "data: daily sync"
            git push origin main
          fi

      - name: Notify Telegram (New Editals & Daily Reminders)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/notify-telegram.js
          node scripts/schedule-reminders.js

      - name: Commit and push updated registry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add registry/
          if git diff --staged --quiet; then
            echo "No changes in registry to commit"
          else
            git commit -m "chore: update telegram registry"
            git push origin main
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: sync-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
